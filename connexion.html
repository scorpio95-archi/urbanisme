<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:sans-serif;font-size:0.72rem;background:#211712;color:#f2e4c8;padding:7px 16px;">
  <a href="https://lakou-inivesite.vercel.app/" style="color:#f2e4c8;text-decoration:none;font-weight:700;">🏠 Lakou Inivesite</a>
  <span style="opacity:0.4;">›</span>
  <a href="https://lakou-archi-rho.vercel.app/" style="color:#f2e4c8;text-decoration:none;font-weight:700;">Lakou Archi</a>
  <span style="opacity:0.4;">›</span>
  <a href="index.html" style="color:#f2e4c8;text-decoration:none;font-weight:700;">Urbanisme</a>
  <span style="opacity:0.4;">›</span>
  <span style="opacity:0.6;">Connexion</span>
</div>

<header>
  <a href="index.html" class="logo-link">
    <span class="logo-text">Urbanisme<small>Lakou Archi</small></span>
  </a>
</header>

<section class="auth-wrap">
  <h1>Se connecter</h1>
  <p class="sub">Accède à ton espace étudiant ou enseignant.</p>

  <form id="loginForm">
    <div class="form-group">
      <label for="l-email">Email</label>
      <input type="email" id="l-email" required>
    </div>

    <div class="form-group">
      <label for="l-password">Mot de passe</label>
      <input type="password" id="l-password" required>
    </div>

    <button type="submit" class="btn-primary" style="width:100%; margin-top:22px;" id="loginBtn">Se connecter</button>
    <div id="loginStatus"></div>
  </form>

  <p class="auth-switch">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
</section>

<footer>
  <p>Une discipline de <strong>Lakou Archi</strong>, dans le réseau Lakou Inivesite.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="connexion.js"></script>
</body>
</html>
