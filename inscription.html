<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — Urbanisme — Lakou Archi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:sans-serif;font-size:0.72rem;background:#211712;color:#f2e4c8;padding:7px 16px;">
  <a href="https://lakou-inivesite.vercel.app/" style="color:#f2e4c8;text-decoration:none;font-weight:700;">🏠 Lakou Inivesite</a>
  <span style="opacity:0.4;">›</span>
  <a href="https://lakou-archi-rho.vercel.app/" style="color:#f2e4c8;text-decoration:none;font-weight:700;">Lakou Archi</a>
  <span style="opacity:0.4;">›</span>
  <a href="index.html" style="color:#f2e4c8;text-decoration:none;font-weight:700;">Urbanisme</a>
  <span style="opacity:0.4;">›</span>
  <span style="opacity:0.6;">Inscription</span>
</div>

<header>
  <a href="index.html" class="logo-link">
    <span class="logo-text">Urbanisme<small>Lakou Archi</small></span>
  </a>
</header>

<section class="auth-wrap">
  <h1>Créer un compte</h1>
  <p class="sub">Rejoins le réseau des étudiants et enseignants en urbanisme.</p>

  <div class="role-toggle">
    <div class="role-btn active" data-role="student">Étudiant</div>
    <div class="role-btn" data-role="teacher">Enseignant</div>
  </div>

  <form id="signupForm">
    <div class="form-group">
      <label for="s-name">Nom complet</label>
      <input type="text" id="s-name" required>
    </div>

    <div class="form-group">
      <label for="s-email">Email</label>
      <input type="email" id="s-email" required>
    </div>

    <div class="form-group">
      <label for="s-password">Mot de passe</label>
      <input type="password" id="s-password" minlength="6" required>
      <div class="form-hint">6 caractères minimum.</div>
    </div>

    <div class="form-group">
      <label for="s-school">École / Université</label>
      <select id="s-school">
        <option value="">Chargement...</option>
        <option value="autre">Autre (précise)</option>
      </select>
    </div>

    <div class="form-group school-other" id="schoolOtherGroup">
      <label for="s-school-other">Nom de ton établissement</label>
      <input type="text" id="s-school-other" placeholder="Écris le nom complet">
    </div>

    <!-- Champs étudiant -->
    <div id="studentFields">
      <div class="form-group">
        <label for="s-level">Niveau</label>
        <select id="s-level">
          <option value="">—</option>
          <option value="L1">L1</option>
          <option value="L2">L2</option>
          <option value="L3">L3</option>
          <option value="M1">M1</option>
          <option value="M2">M2</option>
        </select>
      </div>
    </div>

    <!-- Champs enseignant -->
    <div id="teacherFields" style="display:none;">
      <div class="form-group">
        <label for="s-title">Titre académique</label>
        <input type="text" id="s-title" placeholder="Ex: Professeur, Chargé de cours">
      </div>
      <div class="form-group">
        <label for="s-experience">Années d'expérience</label>
        <input type="number" id="s-experience" min="0">
      </div>
    </div>

    <button type="submit" class="btn-primary" style="width:100%; margin-top:22px;" id="signupBtn">Créer mon compte</button>
    <div id="signupStatus"></div>
  </form>

  <p class="auth-switch">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
</section>

<footer>
  <p>Une discipline de <strong>Lakou Archi</strong>, dans le réseau Lakou Inivesite.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="inscription.js"></script>
</body>
</html>
